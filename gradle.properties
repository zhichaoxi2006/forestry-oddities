## Gradle
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

## Environment
# Minecraft / NeoForge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
neo_version=21.1.230
neo_version_range=[21.1.230,)
loader_version_range=[4,)
java_version=21
# Optional: Maven-format directory holding the NeoForge artifacts, used when
# maven.neoforged.net is unreachable (this machine cannot reach it).
# Empty = use the network repository only.
neoforge_local_mirror=../ForestryCE/build/local-m2

# Parchment parameter mappings
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

## Required dependency: Forestry: Community Edition
# Installed into this machine's Maven Local (see README, "The Forestry dependency"). The alpha9
# artifacts come from the published release jars; ForestryCE's own `publishToMavenLocal` is not
# used for alpha9 because its build now applies a CurseForge plugin that needs a Java 25 daemon.
forestry_group=thedarkcolour.forestry
forestry_artifact=forestry-1.21.1
forestry_version=3.0.0-alpha9
# Compiled against alpha9. The mod only uses API that alpha8 already has, and the mixin targets the
# same method in both, so players that still run the alpha8 jar keep working.
forestry_version_range=[3.0.0-alpha8,)
# Optional Forestry content modules (separate mod jars, dev runtime only).
# 3.0.0-alpha9 publishes `forestrymail` and `forestrybutterflies` only: the farms module has no
# alpha9 jar yet, so it is left out here until it does.
forestry_optional_modules=mail,butterflies

# Forestry requires Patchouli at runtime, and JEI is optional but useful in dev runs.
patchouli_version=1.21.1-93-NEOFORGE
patchouli_version_range=[1.21.1-92,)
jei_version=19.27.0.340
jei_version_range=[19,)
# Set to true to leave JEI off the development runtime.
skip_jei_runtime=false

## Optional dependency: Create (机械动力)
# Create is only needed for the item attribute integration
# (com.zhichaoxi.forestryoddities.integration.create). It is compileOnly + dev runtime only: the mod keeps
# working for players that do not install Create.
# Create 6.0.4-55 is the version resolved by this checkout; the libraries below are Create's own
# runtime dependencies and are not pulled transitively (the Create artifact is used with
# `transitive = false`, as in Create's own dev setup).
create_version=6.0.4-55
create_version_range=[6.0.4,7)
ponder_version=1.0.46
# Flywheel: the API stub used at compile time and the implementation used by the dev client.
# 1.0.4 is the implementation Create 6.0.4-55 / Ponder 1.0.46 ship with; the matching API artifact
# of that release train is 1.0.3.
flywheel_version=1.0.4
flywheel_api_version=1.0.3
registrate_version=MC1.21-1.3.0+62
# Set to true to leave Create and its libraries off the development runtime, for testing that this
# mod still loads and works without Create.
skip_create_runtime=false

## Mod properties
mod_id=forestry_oddities
mod_name=Forestry Oddities
# Same license as Forestry: Community Edition: GNU Lesser General Public License v3.0 (SPDX:
# LGPL-3.0). The full texts are the repository's LICENSE (LGPL-3.0) and LICENSE.GPL-3.0 (the GNU GPL
# v3.0, which the LGPL incorporates by reference); both are packaged into META-INF/ of the jars, and
# this value is what META-INF/neoforge.mods.toml shows in the mod list.
mod_license=LGPL-3.0
mod_version=0.2.0
mod_group_id=com.zhichaoxi.forestryoddities
mod_authors=zhichaoxi2006
mod_description=Oddities and quality-of-life adjustments for Forestry: Community Edition.
