modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

# Mixin configuration: patches Forestry's bee housing rain checks (see forestrytweaks.mixins.json).
# `requiredMods` makes NeoForge skip the config when Forestry is not installed (it is required anyway).
[[mixins]]
config = "forestrytweaks.mixins.json"
requiredMods = ["forestry"]

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Required: Forestry: Community Edition
[[dependencies.${mod_id}]]
modId = "forestry"
type = "required"
versionRange = "${forestry_version_range}"
ordering = "AFTER"
side = "BOTH"

# Forestry: CE itself requires Patchouli, so this mod does too.
[[dependencies.${mod_id}]]
modId = "patchouli"
type = "required"
versionRange = "${patchouli_version_range}"
ordering = "NONE"
side = "BOTH"

# Optional integration
[[dependencies.${mod_id}]]
modId = "jei"
type = "optional"
versionRange = "${jei_version_range}"
ordering = "NONE"
side = "CLIENT"

# Optional: Create (机械动力). Only the item attribute filter integration needs it, so the mod loads
# and works without Create.
[[dependencies.${mod_id}]]
modId = "create"
type = "optional"
versionRange = "${create_version_range}"
ordering = "AFTER"
side = "BOTH"
